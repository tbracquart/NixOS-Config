name: Build host (reusable)

on:
  workflow_call:
    inputs:
      host:
        description: 'Nom du host NixOS à build (ex. ZenBook-13)'
        required: true
        type: string
      flake-lock-artifact:
        description: "Nom d'un artifact contenant un flake.lock à appliquer avant build (optionnel)"
        required: false
        type: string
        default: ''
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Restaurer le flake.lock mis à jour
        if: inputs.flake-lock-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.flake-lock-artifact }}

      - uses: ./.github/actions/setup-nix-cachix

      - name: Build ${{ inputs.host }}
        run: |
          set -eux
          nix build .#nixosConfigurations.${{ inputs.host }}.config.system.build.toplevel -o result --print-build-logs --accept-flake-config

      - name: Push build to Cachix (obligatoire)
        env:
          CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        run: |
          set -eux
          echo "Pushing build outputs to cachix tbracquart"
          cachix push tbracquart result
