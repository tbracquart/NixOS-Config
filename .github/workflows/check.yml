name: NixOS CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      V145-15AST: ${{ steps.host-selection.outputs.V145-15AST }}
      ZenBook-13: ${{ steps.host-selection.outputs.ZenBook-13 }}
      flake: ${{ steps.filter.outputs.flake }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            V145-15AST:
              - 'hosts/V145-15AST/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            ZenBook-13:
              - 'hosts/ZenBook-13/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            flake:
              - 'hosts/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'

      - name: Analyser l’impact de la flake sur les hôtes
        id: impact
        if: github.event_name == 'pull_request' && steps.filter.outputs.flake == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          git fetch --no-tags --depth=1 origin "$BASE_REF"

          # Une modification de flake.nix peut changer arbitrairement les
          # dépendances d’un hôte : dans ce cas, on conserve le comportement
          # conservateur et on construit tous les hôtes.
          if git diff --name-only "origin/${BASE_REF}"...HEAD -- flake.nix | grep -q .; then
            echo 'La flake.nix a changé : tous les hôtes seront construits.'
            echo 'build-hosts=["ZenBook-13","V145-15AST"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git show "origin/${BASE_REF}:flake.lock" > "$tmpdir/before.json"

          if ! output=$(python3 .github/scripts/analyze-flake-impact.py \
            "$tmpdir/before.json" flake.lock .); then
            echo 'L’analyse a échoué : tous les hôtes seront construits.'
            echo 'build-hosts=["ZenBook-13","V145-15AST"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "$output"
          build_hosts=$(printf '%s\n' "$output" | sed -n 's/^build-hosts=//p')
          if [ -z "$build_hosts" ]; then
            echo 'L’analyse n’a pas produit de liste d’hôtes : tous les hôtes seront construits.'
            build_hosts='["ZenBook-13","V145-15AST"]'
          fi
          echo "build-hosts=$build_hosts" >> "$GITHUB_OUTPUT"

      - name: Définir les hôtes à construire
        id: host-selection
        env:
          FILTER_V145: ${{ steps.filter.outputs.V145-15AST }}
          FILTER_ZENBOOK: ${{ steps.filter.outputs.ZenBook-13 }}
          IMPACT_HOSTS: ${{ steps.impact.outputs.build-hosts }}
        run: |
          set -euo pipefail

          if [ -n "${IMPACT_HOSTS:-}" ]; then
            python3 - <<'PY'
          import json
          import os

          hosts = set(json.loads(os.environ["IMPACT_HOSTS"]))
          print(f"V145-15AST={'true' if 'V145-15AST' in hosts else 'false'}")
          print(f"ZenBook-13={'true' if 'ZenBook-13' in hosts else 'false'}")
          PY
          else
            echo "V145-15AST=$FILTER_V145"
            echo "ZenBook-13=$FILTER_ZENBOOK"
          fi | while IFS='=' read -r name value; do
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          done

  # Vérification requise : conserver ce job inconditionnel afin que GitHub
  # publie toujours `flake-check`. L’évaluation Nix elle-même est ignorée
  # lorsqu’elle n’est pas nécessaire.
  flake-check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - name: Vérification non nécessaire
        if: needs.changes.outputs.flake != 'true'
        run: echo "Aucun changement affectant la flake — vérification ignorée"

      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.flake == 'true'

      - uses: ./.github/actions/setup-nix-cachix
        if: needs.changes.outputs.flake == 'true'

      - name: Vérification de la flake (évaluation seule, pas de build)
        if: needs.changes.outputs.flake == 'true'
        run: nix flake check --no-build --accept-flake-config

  # Les checks requis `build-<hôte> / build` doivent rester visibles.
  # Le workflow réutilisable décide donc au niveau du job s’il faut réellement
  # lancer un runner pour l’hôte concerné.
  build-ZenBook-13:
    needs: changes
    uses: ./.github/workflows/build-host.yml
    with:
      host: ZenBook-13
      should-build: ${{ needs.changes.outputs.ZenBook-13 == 'true' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-V145-15AST:
    needs: changes
    uses: ./.github/workflows/build-host.yml
    with:
      host: V145-15AST
      should-build: ${{ needs.changes.outputs.V145-15AST == 'true' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
