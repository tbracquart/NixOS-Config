name: NixOS CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      V145-15AST: ${{ steps.filter.outputs.V145-15AST }}
      ZenBook-13: ${{ steps.filter.outputs.ZenBook-13 }}
      flake: ${{ steps.filter.outputs.flake }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            V145-15AST:
              - 'hosts/V145-15AST/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            ZenBook-13:
              - 'hosts/ZenBook-13/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            flake:
              - 'hosts/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            flake-impact-test:
              - '.github/scripts/analyze-flake-impact.py'
              - 'flake.lock'

      # Keep the analyzer regression test in the existing change-detection
      # runner. It only needs a second invocation when the flake or analyzer
      # itself changes, avoiding a dedicated runner for unrelated PRs.
      - name: Vérifier l'analyse automatique de l'impact des inputs
        if: steps.filter.outputs.flake == 'true' || steps.filter.outputs['flake-impact-test'] == 'true'
        run: |
          tmpdir=$(mktemp -d)
          cp flake.lock "$tmpdir/before.json"
          python3 - "$tmpdir/before.json" "$tmpdir/after.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1]) as f:
              lock = json.load(f)
          lock["nodes"]["nix-cachyos-kernel"]["locked"]["rev"] = "ci-test-revision"
          with open(sys.argv[2], "w") as f:
              json.dump(lock, f)
          PY

          output=$(python3 .github/scripts/analyze-flake-impact.py \
            "$tmpdir/before.json" "$tmpdir/after.json" .)
          echo "$output"
          expected='["ZenBook-13"]'
          actual=$(printf '%s\n' "$output" | sed -n 's/^build-hosts=//p')
          test "$actual" = "$expected"

  # Required check: keep this caller unconditional so GitHub always reports
  # `flake-check`. The actual Nix evaluation is skipped when unnecessary.
  flake-check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - name: Vérification non nécessaire
        if: needs.changes.outputs.flake != 'true'
        run: echo "Aucun changement affectant la flake — vérification ignorée"

      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.flake == 'true'

      - uses: ./.github/actions/setup-nix-cachix
        if: needs.changes.outputs.flake == 'true'

      - name: Vérification de la flake (évaluation seule, pas de build)
        if: needs.changes.outputs.flake == 'true'
        run: nix flake check --no-build --accept-flake-config

  # Required checks `build-<host> / build` must remain visible. Therefore the
  # caller stays unconditional; `build-host.yml` decides at job level whether
  # a runner is needed, avoiding a runner when the host is unaffected.
  build-ZenBook-13:
    needs: changes
    uses: ./.github/workflows/build-host.yml
    with:
      host: ZenBook-13
      should-build: ${{ needs.changes.outputs.ZenBook-13 == 'true' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-V145-15AST:
    needs: changes
    uses: ./.github/workflows/build-host.yml
    with:
      host: V145-15AST
      should-build: ${{ needs.changes.outputs.V145-15AST == 'true' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
