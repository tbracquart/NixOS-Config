name: Check flake

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      v145: ${{ steps.filter.outputs.v145 }}
      zenbook: ${{ steps.filter.outputs.zenbook }}
      flake: ${{ steps.filter.outputs.flake }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            v145:
              - 'hosts/V145-15AST/**'
              - 'flake.nix'
              - 'flake.lock'
            zenbook:
              - 'hosts/ZenBook-13/**'
              - 'common/**'
              - 'flake.nix'
              - 'flake.lock'
            flake:
              - 'hosts/**'
              - 'common/**'
              - 'flake.nix'
              - 'flake.lock'

  flake-check:
    needs: changes
    if: needs.changes.outputs.flake == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc= freesmlauncher.cachix.org-1:Jcp5Q9wiLL+EDv8Mh7c6L9xGk+lXr7/otpKxMOuBuDs= tbracquart.cachix.org-1:eTT16nwdreuvu4yagVFB1p+PeRg8ZCZsCA8648IJCZU=
            substituters = https://cache.nixos.org https://nix-community.cachix.org https://xuyh0120.win https://freesmlauncher.cachix.org https://tbracquart.cachix.org

      - name: Activer le cache Cachix 📦
        uses: cachix/cachix-action@v17
        with:
          name: tbracquart
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Vérification rapide (évaluation seule, pas de build)
        run: nix flake check --no-build --accept-flake-config

  build-zenbook:
    needs: [changes, flake-check]
    if: |
      always() &&
      needs.changes.outputs.zenbook == 'true' &&
      (needs.flake-check.result == 'success' || needs.flake-check.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc= freesmlauncher.cachix.org-1:Jcp5Q9wiLL+EDv8Mh7c6L9xGk+lXr7/otpKxMOuBuDs= tbracquart.cachix.org-1:eTT16nwdreuvu4yagVFB1p+PeRg8ZCZsCA8648IJCZU=
            substituters = https://cache.nixos.org https://nix-community.cachix.org https://xuyh0120.win https://freesmlauncher.cachix.org https://tbracquart.cachix.org

      - name: Activer le cache Cachix 📦
        uses: cachix/cachix-action@v17
        with:
          name: tbracquart
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build ZenBook-13
        run: nix build .#nixosConfigurations.ZenBook-13.config.system.build.toplevel --print-build-logs --accept-flake-config

  build-v145:
    needs: [changes, flake-check]
    if: |
      always() &&
      needs.changes.outputs.v145 == 'true' &&
      (needs.flake-check.result == 'success' || needs.flake-check.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs= lantian:EeAUQ+W+6r7EtwnmYjeVwx5kOGEBpjlBfPlzGlTNvHc= freesmlauncher.cachix.org-1:Jcp5Q9wiLL+EDv8Mh7c6L9xGk+lXr7/otpKxMOuBuDs= tbracquart.cachix.org-1:eTT16nwdreuvu4yagVFB1p+PeRg8ZCZsCA8648IJCZU=
            substituters = https://cache.nixos.org https://nix-community.cachix.org https://xuyh0120.win https://freesmlauncher.cachix.org https://tbracquart.cachix.org

      - name: Activer le cache Cachix 📦
        uses: cachix/cachix-action@v17
        with:
          name: tbracquart
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build V145-15AST
        run: nix build .#nixosConfigurations.V145-15AST.config.system.build.toplevel --print-build-logs --accept-flake-config