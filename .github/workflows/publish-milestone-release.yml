name: Publier la release lorsque le jalon est terminé

on:
  issues:
    types:
      - closed
  workflow_dispatch:

concurrency:
  group: publish-milestone-release-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Vérifier les jalons et publier si nécessaire
    permissions:
      contents: write
      issues: read
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Vérifier les jalons ouverts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Une release est publiée automatiquement lorsqu'un milestone ouvert
          # ne contient plus aucune issue ouverte.
          while IFS=$'\t' read -r number title; do
            [ -n "$number" ] || continue

            open_count=$(gh api \
              "/repos/$REPO/issues?state=open&milestone=$number&per_page=100" \
              --paginate \
              --jq '[.[] | select(.pull_request == null)] | length')

            if [ "$open_count" -eq 0 ]; then
              draft_tag=$(gh release list --limit 100 \
                --json tagName,isDraft \
                --jq '.[] | select(.isDraft) | .tagName' \
                | head -n1 || true)

              if [ -z "$draft_tag" ]; then
                echo "Aucune release en brouillon à publier."
                exit 0
              fi

              echo "Le milestone #$number ($title) est terminé."
              echo "Publication automatique de $draft_tag."
              gh release edit "$draft_tag" --draft=false

              gh api --method PATCH "/repos/$REPO/milestones/$number" \
                -f state=closed

              exit 0
            fi
          done < <(
            gh api "/repos/$REPO/milestones?state=open&per_page=100" \
              --paginate \
              --jq '.[] | [.number, .title] | @tsv'
          )

          echo "Aucun milestone terminé à publier."
