name: NixOS CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      V145-15AST: ${{ steps.filter.outputs.V145-15AST }}
      ZenBook-13: ${{ steps.filter.outputs.ZenBook-13 }}
      flake: ${{ steps.filter.outputs.flake }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            V145-15AST:
              - 'hosts/V145-15AST/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            ZenBook-13:
              - 'hosts/ZenBook-13/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            flake:
              - 'hosts/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'

  # Keep this job unconditional because the check is required by the ruleset.
  # Only perform the Nix evaluation when flake-related files changed.
  flake-check:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - name: Vérification non nécessaire
        if: needs.changes.outputs.flake != 'true'
        run: echo "Aucun changement affectant la flake — vérification ignorée"

      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.flake == 'true'

      - uses: ./.github/actions/setup-nix-cachix
        if: needs.changes.outputs.flake == 'true'

      - name: Vérification de la flake (évaluation seule, pas de build)
        if: needs.changes.outputs.flake == 'true'
        run: nix flake check --no-build --accept-flake-config

  build-ZenBook-13:
    needs: changes
    uses: ./.github/workflows/build-host.yml
    with:
      host: ZenBook-13
      should-build: ${{ needs.changes.outputs.ZenBook-13 == 'true' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-V145-15AST:
    needs: changes
    uses: ./.github/workflows/build-host.yml
    with:
      host: V145-15AST
      should-build: ${{ needs.changes.outputs.V145-15AST == 'true' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
