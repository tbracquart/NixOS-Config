name: NixOS CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'ci-please')
    outputs:
      V145-15AST: ${{ steps.filter.outputs.V145-15AST }}
      ZenBook-13: ${{ steps.filter.outputs.ZenBook-13 }}
      flake: ${{ steps.filter.outputs.flake }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            V145-15AST:
              - 'hosts/V145-15AST/**'
              - 'flake.nix'
              - 'flake.lock'
            ZenBook-13:
              - 'hosts/ZenBook-13/**'
              - 'common/**'
              - 'flake.nix'
              - 'flake.lock'
            flake:
              - 'hosts/**'
              - 'common/**'
              - 'flake.nix'
              - 'flake.lock'

  # Garde-fou léger uniquement sur push direct vers main (pas sur PR : le
  # build ciblé qui suit réévalue de toute façon la dérivation concernée,
  # donc faire tourner flake-check en plus sur chaque PR ne faisait que
  # dupliquer l'évaluation complète de la flake pour rien).
  flake-check:
    needs: changes
    if: needs.changes.outputs.flake == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-cachix

      - name: Vérification rapide (évaluation seule, pas de build)
        run: nix flake check --no-build --accept-flake-config

  build-ZenBook-13:
    needs: changes
    if: needs.changes.outputs.ZenBook-13 == 'true'
    uses: ./.github/workflows/build-host.yml
    with:
      host: ZenBook-13
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-V145-15AST:
    needs: changes
    if: needs.changes.outputs.V145-15AST == 'true'
    uses: ./.github/workflows/build-host.yml
    with:
      host: V145-15AST
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
