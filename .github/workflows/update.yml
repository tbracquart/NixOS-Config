name: Update flake

on:
  schedule:
    - cron: '0 3 * * *'  # tous les jours à 3h UTC (5h en France en heure d'été)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  update:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      pr-title: ${{ steps.diff.outputs.title }}
      pr-body: ${{ steps.diff.outputs.body }}
      build-hosts: ${{ steps.diff.outputs.build-hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-cachix
        with:
          github-access-token: ${{ secrets.GITHUB_TOKEN }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Sauver flake.lock avant mise à jour
        run: cp flake.lock /tmp/flake.lock.before

      - name: Mettre à jour flake.lock
        id: update
        run: |
          nix flake update --accept-flake-config
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Calculer le diff des inputs et l'impact par host
        id: diff
        if: steps.update.outputs.changed == 'true'
        run: |
          python3 <<'EOF' >> "$GITHUB_OUTPUT"
          import json
          import subprocess

          with open("/tmp/flake.lock.before") as f:
              before = json.load(f)
          with open("flake.lock") as f:
              after = json.load(f)

          result = subprocess.run(
              ["python3", ".github/scripts/analyze-flake-impact.py",
               "/tmp/flake.lock.before", "flake.lock", "."],
              text=True,
              capture_output=True,
              check=True,
          )

          impact = {}
          for line in result.stdout.splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  impact[key] = value

          changed_names = [name for name in impact["changed-inputs"].split(",") if name]

          def resolve(data, name):
              ref = data["nodes"]["root"]["inputs"].get(name)
              if ref is None:
                  return None
              node_name = ref if isinstance(ref, str) else ref[-1]
              return data["nodes"].get(node_name, {}).get("locked")

          changed = []
          for name in changed_names:
              locked_before = resolve(before, name)
              locked_after = resolve(after, name)
              lm_before = locked_before.get("lastModified") if locked_before else None
              lm_after = locked_after.get("lastModified") if locked_after else None
              if lm_before is not None and lm_after is not None:
                  delta_days = round((lm_after - lm_before) / 86400)
                  sign = "+" if delta_days >= 0 else ""
                  changed.append(f"{name} ({sign}{delta_days}j)")
              else:
                  changed.append(name)

          if changed:
              title = "chore: nix flake update — " + ", ".join(changed)
              body_lines = "\n".join(f"- {c}" for c in changed)
          else:
              title = "chore: nix flake update (auto)"
              body_lines = "- Aucun changement détecté dans les inputs de premier niveau"

          build_hosts = json.loads(impact["build-hosts"])
          body_lines += "\n\n## Hosts à builder\n"
          for host in sorted(key.removeprefix("host-inputs-") for key in impact if key.startswith("host-inputs-")):
              if host in build_hosts:
                  body_lines += f"- `{host}` : build\n"
              else:
                  body_lines += f"- `{host}` : ignoré (aucune dépendance affectée)\n"

          print(f"title={title[:70]}")
          print("body<<BODY_EOF")
          print(body_lines)
          print("BODY_EOF")
          print("build-hosts=" + json.dumps(build_hosts, separators=(",", ":")))
          EOF

      - name: Sauver flake.lock mis à jour
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flake-lock
          path: flake.lock
          if-no-files-found: error
          retention-days: 1

  build-hosts:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.update.outputs.build-hosts) }}
    uses: ./.github/workflows/build-host.yml
    with:
      host: ${{ matrix.host }}
      flake-lock-artifact: flake-lock
      push-to-cachix: true
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  open-pr:
    needs: [update, build-hosts]
    if: >-
      always() &&
      needs.update.outputs.changed == 'true' &&
      needs.build-hosts.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: false

      - name: Récupérer le flake.lock mis à jour
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: flake-lock

      - name: Ouvrir une PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: ${{ needs.update.outputs.pr-title }}
          title: ${{ needs.update.outputs.pr-title }}
          body: |
            Mise à jour automatique quotidienne de `flake.lock`.

            ## Inputs mis à jour
            ${{ needs.update.outputs.pr-body }}

            Les hosts affectés ont déjà été buildés et poussés vers Cachix ; les checks de PR devraient donc pouvoir réutiliser ces résultats.
          branch: auto/flake-update
          delete-branch: true
