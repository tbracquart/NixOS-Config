name-template: 'Version $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# La version CalVer (YY.MM.DD, avec suffixe -N si plusieurs merges le même
# jour) est calculée directement dans le workflow .github/workflows/release-drafter.yml
# et transmise via les inputs "tag" et "name". Pas de version-template/version-resolver
# ici : Release Drafter ne doit pas recalculer la version lui-même.

categories:
  - type: 'pre-exclude'
    when:
      labels:
        - 'ignore-for-release'
        - 'skip-changelog'
        - 'duplicate'
        - 'invalid'
        - 'wontfix'
        - 'question'
  - title: '🚀 Fonctionnalités'
    when:
      labels:
        - 'type: enhancement'
  - title: '🐛 Corrections'
    when:
      labels:
        - 'type: bug'
  - title: '🔧 CI / Tooling'
    when:
      labels:
        - 'ci-please'
        - 'area: ci'
  - title: '🧹 Maintenance'
    when:
      labels:
        - 'type: chore'
  - title: '📦 Dépendances'
    when:
      labels:
        - 'area: nix-config'
  - title: '🖥️ Config hosts'
    when:
      labels:
        - 'host: zenbook-13'
        - 'host: v145-15ast'
  - title: '📝 Autres'
    when:
      labels:
        - '*'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'
no-changes-template: '- Aucun changement'

template: |
  ## Changements

  $CHANGES

autolabeler:
  - label: 'ci-please'
    files:
      - '.github/workflows/*'
  - label: 'area: nix-config'
    branch:
      - '/^update\/.+/'
    title:
      - '/flake.lock/i'
