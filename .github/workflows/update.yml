  open-pr:
    needs: [update, build-ZenBook-13, build-V145-15AST]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Récupérer le flake.lock mis à jour
        uses: actions/download-artifact@v8
        with:
          name: flake-lock

      - name: Ouvrir une PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: ${{ needs.update.outputs.pr-title }}
          title: ${{ needs.update.outputs.pr-title }}
          body: |
            Mise à jour automatique quotidienne de `flake.lock`.

            ## Inputs mis à jour
            ${{ needs.update.outputs.pr-body }}

            Les deux hosts ont déjà été buildés et poussés vers Cachix ; les checks de PR devraient donc pouvoir réutiliser ces résultats.
          branch: auto/flake-update