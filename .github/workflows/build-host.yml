name: Build host (reusable)

on:
  workflow_call:
    inputs:
      host:
        description: 'Nom du host NixOS à build (ex. ZenBook-13)'
        required: true
        type: string
      use-nix-store-cache:
        description: 'Activer le cache GitHub du store Nix (utile pour les runs lourds comme update.yml)'
        required: false
        type: boolean
        default: false
      flake-lock-artifact:
        description: "Nom d'un artifact contenant un flake.lock à appliquer avant build (optionnel)"
        required: false
        type: string
        default: ''
    secrets:
      CACHIX_AUTH_TOKEN:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Restaurer le flake.lock mis à jour
        if: inputs.flake-lock-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.flake-lock-artifact }}

      - uses: ./.github/actions/setup-nix-cachix

      - name: Restaurer/sauver le store Nix
        if: inputs.use-nix-store-cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Build ${{ inputs.host }}
        run: nix build .#nixosConfigurations.${{ inputs.host }}.config.system.build.toplevel --print-build-logs --accept-flake-config