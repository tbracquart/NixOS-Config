name: Attacher l'ISO à une release publiée

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release cible"
        required: true
        type: string

concurrency:
  group: release-versioned-iso-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    # installer-latest est une release rolling distincte.
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'installer-latest'
    name: Construire l'ISO versionnée
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.target_commitish || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-cachix
        with:
          github-access-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'ISO
        run: |
          set -eux
          nix build .#nixosConfigurations.installer.config.system.build.isoImage \
            -o result \
            --no-update-lock-file \
            --print-build-logs \
            --accept-flake-config

      - name: Attacher l'ISO à la release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" result/iso/*.iso --clobber
