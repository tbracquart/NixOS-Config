name: NixOS CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      V145-15AST: ${{ steps.filter.outputs.V145-15AST }}
      ZenBook-13: ${{ steps.filter.outputs.ZenBook-13 }}
      flake: ${{ steps.filter.outputs.flake }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            V145-15AST:
              - 'hosts/V145-15AST/**'
              - 'flake.nix'
              - 'flake.lock'
            ZenBook-13:
              - 'hosts/ZenBook-13/**'
              - 'common/**'
              - 'flake.nix'
              - 'flake.lock'
            flake:
              - 'hosts/**'
              - 'common/**'
              - 'flake.nix'
              - 'flake.lock'

  flake-check:
    needs: changes
    if: needs.changes.outputs.flake == 'true'
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-cachix

      - name: Vérification rapide (évaluation seule, pas de build)
        run: nix flake check --no-build --accept-flake-config

  build-ZenBook-13:
    needs: [changes, flake-check]
    if: |
      always() &&
      needs.changes.outputs.ZenBook-13 == 'true' &&
      (needs.flake-check.result == 'success' || needs.flake-check.result == 'skipped')
    uses: ./.github/workflows/build-host.yml
    with:
      host: ZenBook-13
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-V145-15AST:
    needs: [changes, flake-check]
    if: |
      always() &&
      needs.changes.outputs.V145-15AST == 'true' &&
      (needs.flake-check.result == 'success' || needs.flake-check.result == 'skipped')
    uses: ./.github/workflows/build-host.yml
    with:
      host: V145-15AST
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}