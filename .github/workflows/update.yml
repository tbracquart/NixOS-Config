name: Update flake

on:
  schedule:
    - cron: '0 4 * * *'  # tous les jours à 4h UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    outputs:
      changed: ${{ steps.update.outputs.changed }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-cachix

      - name: Mettre à jour flake.lock
        id: update
        run: |
          nix flake update --accept-flake-config
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sauver flake.lock mis à jour
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: flake-lock
          path: flake.lock

  build-ZenBook-13:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build-host.yml
    with:
      host: ZenBook-13
      use-nix-store-cache: true
      flake-lock-artifact: flake-lock
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-V145-15AST:
    needs: update
    if: needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/build-host.yml
    with:
      host: V145-15AST
      use-nix-store-cache: true
      flake-lock-artifact: flake-lock
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  open-pr:
    needs: [update, build-ZenBook-13, build-V145-15AST]
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Récupérer le flake.lock mis à jour
        uses: actions/download-artifact@v4
        with:
          name: flake-lock

      - name: Ouvrir une PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: "chore: nix flake update (auto)"
          title: "chore: nix flake update (auto)"
          body: |
            Mise à jour automatique quotidienne de `flake.lock`.

            Les deux hosts (ZenBook-13, V145-15AST) ont déjà été buildés
            et poussés vers Cachix par ce workflow — merger cette PR ne
            devrait déclencher aucune recompilation.
          branch: auto/flake-update
          delete-branch: true
