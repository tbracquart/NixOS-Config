name-template: 'Draft $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# CalVer : YY.MM.DD — la date fait foi, aucune décision à prendre.
# $MAJOR/$MINOR sont réutilisés ici pour porter année/mois (ce ne sont pas
# des "versions majeures/mineures" au sens SemVer), $PATCH sert de compteur
# du jour, incrémenté automatiquement s'il y a plusieurs merges à la même date.
version-template: '$MAJOR.$MINOR.$PATCH'
version-resolver:
  default: patch

categories:
  - title: '🚀 Fonctionnalités'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '🐛 Corrections'
    labels:
      - 'bug'
      - 'fix'
  - title: '🔧 CI / Tooling'
    labels:
      - 'ci-please'
      - 'ci'
  - title: '📦 Dépendances'
    labels:
      - 'dependencies'
      - 'flake-update'
  - title: '🖥️ Config hosts'
    labels:
      - 'zenbook-13'
      - 'v145-15ast'
  - title: '📝 Autres'
    labels:
      - '*'

exclude-labels:
  - 'ignore-for-release'
  - 'skip-changelog'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'

template: |
  ## Changements

  $CHANGES

autolabeler:
  - label: 'ci-please'
    files:
      - '.github/workflows/*'
  - label: 'flake-update'
    branch:
      - '/^update\/.+/'
    title:
      - '/flake.lock/i'