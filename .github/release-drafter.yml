name-template: 'Version $RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# La version CalVer (YY.MM.DD, avec suffixe -N si plusieurs merges le même
# jour) est calculée directement dans le workflow .github/workflows/release-drafter.yml
# et transmise via l'input "version". Pas de version-template/version-resolver
# ici : Release Drafter ne doit pas recalculer la version lui-même.

categories:
  - title: '🚀 Fonctionnalités'
    labels:
      - 'type: enhancement'
  - title: '🐛 Corrections'
    labels:
      - 'type: bug'
  - title: '🔧 CI / Tooling'
    labels:
      - 'ci-please'
      - 'area: ci'
  - title: '🧹 Maintenance'
    labels:
      - 'type: chore'
  - title: '📦 Dépendances'
    labels:
      - 'area: nix-config'
  - title: '🖥️ Config hosts'
    labels:
      - 'host: zenbook-13'
      - 'host: v145-15ast'
  - title: '📝 Autres'
    labels:
      - '*'

exclude-labels:
  - 'ignore-for-release'
  - 'skip-changelog'
  - 'duplicate'
  - 'invalid'
  - 'wontfix'
  - 'question'

change-template: '- $TITLE (#$NUMBER)'
change-title-escapes: '\<*_&'
no-changes-template: '- Aucun changement'

template: |
  ## Changements

  $CHANGES

autolabeler:
  - label: 'ci-please'
    files:
      - '.github/workflows/*'
  - label: 'area: nix-config'
    branch:
      - '/^update\/.+/'
    title:
      - '/flake.lock/i'
