name: Update flake

on:
  schedule:
    - cron: '0 4 * * *'  # tous les jours à 4h UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-cachix

      - name: Restaurer/sauver le store Nix
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never

      - name: Mettre à jour flake.lock
        id: update
        run: |
          nix flake update --accept-flake-config
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build ZenBook-13
        if: steps.update.outputs.changed == 'true'
        run: nix build .#nixosConfigurations.ZenBook-13.config.system.build.toplevel --print-build-logs --accept-flake-config

      - name: Build V145-15AST
        if: steps.update.outputs.changed == 'true'
        run: nix build .#nixosConfigurations.V145-15AST.config.system.build.toplevel --print-build-logs --accept-flake-config

      - name: Ouvrir une PR si flake.lock a changé
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: nix flake update (auto)"
          title: "chore: nix flake update (auto)"
          body: |
            Mise à jour automatique quotidienne de `flake.lock`.

            Les deux hosts (ZenBook-13, V145-15AST) ont déjà été buildés
            et poussés vers Cachix par ce workflow — merger cette PR ne
            devrait déclencher aucune recompilation.
          branch: auto/flake-update
          delete-branch: true