name: PR authorization

on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  authorization:
    name: authorization
    runs-on: ubuntu-latest
    steps:
      - name: Check PR authorization
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.review.pull_request_url && github.event.review.pull_request_url || '' }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login || '' }}
        run: |
          set -euo pipefail

          # pull_request_review events do not expose pull_request.number directly.
          if [ -z "$PR_NUMBER" ] || [[ "$PR_NUMBER" == https://api.github.com/repos/*/pulls/* ]]; then
            if [[ "$PR_NUMBER" == https://api.github.com/repos/*/pulls/* ]]; then
              PR_NUMBER="${PR_NUMBER##*/}"
            fi
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "Unable to determine pull request number."
            exit 1
          fi

          pr_json="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER")"

          author="$(jq -r '.user.login' <<<"$pr_json")"
          head_sha="$(jq -r '.head.sha' <<<"$pr_json")"

          echo "PR #$PR_NUMBER"
          echo "Author: $author"
          echo "Head: $head_sha"

          # Repository owner is always authorized to merge their own PRs.
          if [ "$author" = "tbracquart" ]; then
            echo "Authorized: repository owner."
            exit 0
          fi

          files="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")"

          unauthorized="$(jq -r '.[] | .filename' <<<"$files" | while IFS= read -r file; do
            case "$file" in
              hosts/V145-15AST/*|users/quentin/*)
                ;;
              *)
                printf '%s\n' "$file"
                ;;
            esac
          done)"

          if [ -z "$unauthorized" ]; then
            echo "Authorized: all changed paths are delegated to $author."
            exit 0
          fi

          echo "Unauthorized paths for $author:"
          printf '%s\n' "$unauthorized"
          echo
          echo "An approval from @tbracquart is required."

          approved="$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pulls/$PR_NUMBER/reviews?per_page=100" \
            | jq -r --arg sha "$head_sha" '
                map(select(.user.login == "tbracquart" and .state == "APPROVED" and .commit_id == $sha))
                | length
              ')

          if [ "$approved" -gt 0 ]; then
            echo "Authorized: @tbracquart approved the current head commit."
            exit 0
          fi

          echo "Blocked: no approval from @tbracquart for the current head commit."
          exit 1
