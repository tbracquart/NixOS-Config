name: Update flake

on:
  schedule:
    - cron: '0 3 * * *'  # tous les jours à 3h UTC (5h en France en heure d'été)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    outputs:
      changed: ${{ steps.update.outputs.changed }}
      pr-title: ${{ steps.diff.outputs.title }}
      pr-body: ${{ steps.diff.outputs.body }}
      build-zenbook: ${{ steps.diff.outputs.build-zenbook }}
      build-v145: ${{ steps.diff.outputs.build-v145 }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-cachix

      - name: Sauver flake.lock avant mise à jour
        run: cp flake.lock /tmp/flake.lock.before

      - name: Mettre à jour flake.lock
        id: update
        run: |
          nix flake update --accept-flake-config
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Compare les inputs de premier niveau (déclarés dans flake.nix, via
      # nodes.root.inputs) entre l'ancien et le nouveau flake.lock, et
      # calcule l'écart en jours pour chacun de ceux qui ont changé. Sert à
      # donner un titre de PR informatif ("nixpkgs (+3j), home-manager (+2j)")
      # plutôt que le générique "chore: nix flake update (auto)" qui ne
      # dit rien du contenu réel une fois repris dans le changelog de
      # release publiée par release-drafter.
      - name: Calculer le diff des inputs
        id: diff
        if: steps.update.outputs.changed == 'true'
        run: |
          python3 <<'EOF' >> "$GITHUB_OUTPUT"
          import json

          with open("/tmp/flake.lock.before") as f:
              before = json.load(f)
          with open("flake.lock") as f:
              after = json.load(f)

          def resolve(data, name):
              ref = data["nodes"]["root"]["inputs"].get(name)
              if ref is None:
                  return None
              node_name = ref if isinstance(ref, str) else ref[-1]
              return data["nodes"].get(node_name, {}).get("locked")

          root_inputs = sorted(before["nodes"]["root"]["inputs"].keys())
          changed = []
          changed_names = set()
          for name in root_inputs:
              locked_before = resolve(before, name)
              locked_after = resolve(after, name)
              if locked_before is not None and locked_after is not None and locked_before != locked_after:
                  changed_names.add(name)
                  lm_before = locked_before.get("lastModified")
                  lm_after = locked_after.get("lastModified")
                  if lm_before is not None and lm_after is not None:
                      delta_days = round((lm_after - lm_before) / 86400)
                      sign = "+" if delta_days >= 0 else ""
                      changed.append(f"{name} ({sign}{delta_days}j)")
                  else:
                      changed.append(name)

          if changed:
              title = "chore: nix flake update — " + ", ".join(changed)
              body_lines = "\n".join(f"- {c}" for c in changed)
          else:
              title = "chore: nix flake update (auto)"
              body_lines = "- Aucun changement détecté dans les inputs de premier niveau"

          # All current root inputs affect both hosts through common modules,
          # except nix-cachyos-kernel, which is only used by ZenBook-13.
          # Avoid building V145-15AST when that is the only updated input.
          build_zenbook = "true"
          build_v145 = "false" if changed_names == {"nix-cachyos-kernel"} else "true"

          print(f"title={title}")
          print("body<<BODY_EOF")
          print(body_lines)
          print("BODY_EOF")
          print(f"build-zenbook={build_zenbook}")
          print(f"build-v145={build_v145}")
          EOF

      - name: Sauver flake.lock mis à jour
        if: steps.update.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock

  build-ZenBook-13:
    needs: update
    if: needs.update.outputs.changed == 'true' && needs.update.outputs.build-zenbook == 'true'
    uses: ./.github/workflows/build-host.yml
    with:
      host: ZenBook-13
      flake-lock-artifact: flake-lock
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-V145-15AST:
    needs: update
    if: needs.update.outputs.changed == 'true' && needs.update.outputs.build-v145 == 'true'
    uses: ./.github/workflows/build-host.yml
    with:
      host: V145-15AST
      flake-lock-artifact: flake-lock
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  open-pr:
    needs: [update, build-ZenBook-13, build-V145-15AST]
    if: >-
      always() &&
      needs.update.outputs.changed == 'true' &&
      needs.build-ZenBook-13.result == 'success' &&
      (needs.build-V145-15AST.result == 'success' || needs.build-V145-15AST.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Récupérer le flake.lock mis à jour
        uses: actions/download-artifact@v8
        with:
          name: flake-lock

      - name: Ouvrir une PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: ${{ needs.update.outputs.pr-title }}
          title: ${{ needs.update.outputs.pr-title }}
          body: |
            Mise à jour automatique quotidienne de `flake.lock`.

            ## Inputs mis à jour
            ${{ needs.update.outputs.pr-body }}

            Les hosts affectés ont déjà été buildés et poussés vers Cachix ; les checks de PR devraient donc pouvoir réutiliser ces résultats.
          branch: auto/flake-update
          delete-branch: true
