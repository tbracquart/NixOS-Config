name: Check flake

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: cachix/cachix-action@v15
        with:
          name: nix-community

      - name: Vérification générale du flake
        run: nix flake check --no-build

      - name: Build ZenBook-13
        run: nix build .#nixosConfigurations.ZenBook-13.config.system.build.toplevel --print-build-logs

      - name: Build V145-15AST
        run: nix build .#nixosConfigurations.V145-15AST.config.system.build.toplevel --print-build-logs
