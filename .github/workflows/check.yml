name: NixOS CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      V145-15AST: ${{ steps.filter.outputs.V145-15AST }}
      ZenBook-13: ${{ steps.filter.outputs.ZenBook-13 }}
      flake: ${{ steps.filter.outputs.flake }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          filters: |
            V145-15AST:
              - 'hosts/V145-15AST/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            ZenBook-13:
              - 'hosts/ZenBook-13/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'
            flake:
              - 'hosts/**'
              - 'common/**'
              - 'profiles/**'
              - 'modules/**'
              - 'users/**'
              - 'secrets/**'
              - 'flake.nix'
              - 'flake.lock'

  # On pull requests, always evaluate the flake so configuration errors are
  # caught before merge. On main, only run it when flake-related files changed.
  flake-check:
    needs: changes
    if: github.event_name == 'pull_request' || needs.changes.outputs.flake == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CACHIX_AUTH_TOKEN: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-nix-cachix

      - name: Vérification de la flake (évaluation seule, pas de build)
        run: nix flake check --no-build --accept-flake-config

  build-ZenBook-13:
    needs: changes
    uses: ./.github/workflows/build-host.yml
    with:
      host: ZenBook-13
      should-build: ${{ needs.changes.outputs.ZenBook-13 == 'true' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}

  build-V145-15AST:
    needs: changes
    uses: ./.github/workflows/build-host.yml
    with:
      host: V145-15AST
      should-build: ${{ needs.changes.outputs.V145-15AST == 'true' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
