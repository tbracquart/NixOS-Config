name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  update_release_draft:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Calcule la version CalVer du jour : YY.MM.DD, avec un compteur
      # séparé par "-" qui s'incrémente s'il y a déjà un tag pour aujourd'hui.
      # 1er merge du jour -> 26.08.21
      # 2e merge du jour  -> 26.08.21-2
      - name: Compute CalVer
        id: calver
        run: |
          set -euo pipefail
          BASE=$(date +'%y.%m.%d')
          COUNT=$(git tag -l "v${BASE}*" | wc -l)
          if [ "$COUNT" -eq 0 ]; then
            VERSION="$BASE"
          else
            VERSION="${BASE}-$((COUNT + 1))"
          fi
          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Debug version output
        run: echo "Version passed to release-drafter -> '${{ steps.calver.outputs.version }}'"

      - uses: release-drafter/release-drafter@v6
        with:
          version: ${{ steps.calver.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}